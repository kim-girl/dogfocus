<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>25분이라도 집중 좀 해라</title>
  <style>
    @font-face {
      font-family: "Bookk Myungjo";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Lt.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Bookk Myungjo";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Bd.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --ink: #40332c;
      --muted: #806e61;
      --cream: #fffaf1;
      --sand: #d9c2a2;
      --coral: #9a6351;
      --green: #728c76;
      --shadow: 0 18px 45px rgba(84, 57, 42, .16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", "Apple SD Gothic Neo", system-ui, sans-serif;
      background: radial-gradient(circle at 12% 12%, #f4e4c9 0 8%, transparent 25%),
                  radial-gradient(circle at 90% 90%, #e7dfcc 0 10%, transparent 27%), #f4eee5;
    }
    .app {
      width: min(92vw, 470px); text-align: center; padding: 31px 28px 26px;
      background: rgba(255, 250, 241, .9); border: 1px solid rgba(255,255,255,.8);
      border-radius: 32px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
    }
    .top { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .tomato { font-size: 25px; transform: rotate(-8deg); }
    h1 { font-family: "Bookk Myungjo", "AppleMyungjo", serif; font-size: clamp(1.62rem, 5.4vw, 2.12rem); margin: 0; font-weight: 700; letter-spacing: -.07em; line-height: 1.18; }
    .timer-wrap { position: relative; width: min(100%, 350px); height: 357px; margin: -3px auto 14px; }
    .dog-character { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .28s ease; }
    .dog-character.selected { opacity: 1; visibility: visible; }
    .puppy-clock { position: absolute; inset: 0; width: 100%; height: auto; z-index: 1; pointer-events: none; }
    .puppy-clock.stern { opacity: 0; animation: stern-look 3s ease-in-out infinite; }
    @keyframes stern-look { 0%, 28%, 72%, 100% { opacity: 0; } 38%, 62% { opacity: 1; } }
    .puppy-clock.sniff { opacity: 0; animation: nose-sniff 1.25s ease-in-out infinite; }
    @keyframes nose-sniff { 0%, 38%, 76%, 100% { opacity: 0; } 50%, 64% { opacity: 1; } }
    .timer { position: absolute; z-index: 3; left: 50%; top: 67.5%; width: 195px; transform: translate(-50%, -50%); display: grid; place-content: center; }
    .dog-maltese .timer { top: 72.5%; }
    .time { font-size: 3.35rem; font-weight: 800; letter-spacing: -.015em; margin-left: -.015em; font-variant-numeric: tabular-nums; }
    .buttons { display: flex; justify-content: center; gap: 10px; }
    button { border: 0; font: inherit; font-weight: 700; cursor: pointer; border-radius: 15px; padding: 13px 20px; transition: transform .15s, filter .15s; }
    button:hover { transform: translateY(-2px); filter: brightness(.98); }
    button:active { transform: translateY(0); }
    #start { min-width: 126px; background: var(--coral); color: #fff; box-shadow: 0 5px 12px rgba(242,140,132,.27); }
    #reset { background: #f2eae7; color: var(--muted); }
    .dog-selector { display: flex; justify-content: center; gap: 8px; margin: 15px 0 0; }
    .dog-choice { padding: 8px 12px; color: var(--muted); background: #f2eae7; border-radius: 999px; font-size: .78rem; }
    .dog-choice:hover { transform: none; }
    .dog-choice.selected { color: #fff; background: var(--coral); }
    .duration-picker { display: flex; justify-content: center; gap: 8px; margin: 17px 0 3px; }
    .duration-picker button { padding: 8px 13px; border: 1px solid #eadbd0; border-radius: 999px; background: #fffaf6; color: var(--muted); font-size: .78rem; }
    .duration-picker button[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: #fff; }
    .alert-test { margin-top: 12px; padding: 6px 9px; color: var(--muted); background: transparent; border-radius: 8px; font-size: .74rem; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .alert-test:hover { transform: none; color: var(--coral); }
    .test-result { min-height: 1.2em; margin: 3px 0 0; color: var(--muted); font-size: .7rem; }
    .count { margin: 28px 0 0; padding: 16px; background: #fff; border-radius: 18px; color: var(--muted); font-size: .9rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .count strong { color: var(--coral); font-size: 1.4rem; margin: 0 4px; line-height: 1; }
    .dots { color: var(--coral); font-size: 1.2rem; line-height: 1; }
    .note { color: var(--muted); font-size: .72rem; margin: 17px 0 0; line-height: 1.5; }
    .rest #start { background: var(--green); box-shadow: 0 5px 12px rgba(113,173,145,.25); }
    @media (max-width: 380px) { .app { padding: 27px 20px 22px; } .timer-wrap { width: 310px; height: 317px; } .timer { width: 173px; height: 173px; } .time { font-size: 2.95rem; } }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="top"><span class="tomato" aria-hidden="true">🐾</span><h1 id="heading">30분이라도 집중 좀 해라</h1></div>
    <div class="duration-picker" aria-label="집중 시간 선택">
      <button type="button" data-minutes="30" aria-pressed="true">30분 포모도로</button>
      <button type="button" data-minutes="60" aria-pressed="false">1시간 포모도로</button>
    </div>
    <div class="timer-wrap">
      <div class="dog-character" data-dog="schnauzer">
        <img class="puppy-clock" src="schnauzer-clock.png" alt="시계를 안고 있는 슈나우저 강아지" />
        <img class="puppy-clock stern" src="schnauzer-clock-stern.png" alt="" aria-hidden="true" />
      </div>
      <div class="dog-character selected" data-dog="maltese">
        <img class="puppy-clock" src="maltese-clock.png" alt="시계를 안고 있는 말티즈 강아지" />
        <img class="puppy-clock sniff" src="maltese-clock-sniff.png" alt="" aria-hidden="true" />
      </div>
      <div class="timer"><div class="time" id="time">30:00</div></div>
    </div>
    <div class="buttons"><button id="start">시작하기</button><button id="reset">초기화</button></div>
    <div class="dog-selector" aria-label="강아지 선택">
      <button class="dog-choice" type="button" data-choice="schnauzer" aria-pressed="false">슈나우저</button>
      <button class="dog-choice selected" type="button" data-choice="maltese" aria-pressed="true">말티즈</button>
    </div>
    <button class="alert-test" id="test-alert" type="button">알림과 소리 테스트</button>
    <p class="test-result" id="test-result" aria-live="polite"></p>
    <div class="count"><span class="dots">●</span><span>오늘 <strong id="count">0</strong>개의 포모도로를 완성했어요</span></div>
    <p class="note">타이머가 끝나면 자동으로 다음 시간으로 전환돼요.<br>알림 권한은 시작할 때 요청합니다.</p>
  </main>
  <script>
    const REST = 5 * 60;
    const el = id => document.getElementById(id);
    const app = el('app'), timeEl = el('time'), heading = el('heading');
    const start = el('start'), reset = el('reset'), countEl = el('count');
    const testAlert = el('test-alert'), testResult = el('test-result');
    const durationButtons = document.querySelectorAll('[data-minutes]');
    const dogCharacters = document.querySelectorAll('.dog-character'), dogChoices = document.querySelectorAll('.dog-choice');
    let workMinutes = 30, isWork = true, remaining = workMinutes * 60, running = false, timerId = null, deadline = null, audioContext = null;
    const todayKey = () => `pomodoro-count-${new Date().toLocaleDateString('sv-SE')}`;

    function getCount() { return Number(localStorage.getItem(todayKey()) || 0); }
    function selectDog(name) {
      dogCharacters.forEach(item => item.classList.toggle('selected', item.dataset.dog === name));
      app.classList.toggle('dog-maltese', name === 'maltese');
      dogChoices.forEach(item => {
        const selected = item.dataset.choice === name;
        item.classList.toggle('selected', selected);
        item.setAttribute('aria-pressed', String(selected));
      });
      localStorage.setItem('pomodoro-dog', name);
    }
    function draw() {
      const minutes = Math.floor(remaining / 60), seconds = remaining % 60;
      timeEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      app.classList.toggle('rest', !isWork);
      countEl.textContent = getCount();
      heading.textContent = `${workMinutes === 60 ? '1시간' : `${workMinutes}분`}이라도 집중 좀 해라`;
      document.title = `${timeEl.textContent} · ${isWork ? '집중' : '휴식'} | ${workMinutes}분 포모도로`;
    }
    function armSound() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
      } catch (_) {}
    }
    function chime() {
      if (!audioContext) return;
      try { [523.25, 659.25, 783.99].forEach((f, i) => { const o = audioContext.createOscillator(), g = audioContext.createGain(); const at = audioContext.currentTime + i * .18; o.frequency.value = f; g.gain.setValueAtTime(.12, at); g.gain.exponentialRampToValueAtTime(.001, at + .25); o.connect(g).connect(audioContext.destination); o.start(at); o.stop(at + .28); }); } catch (_) {}
    }
    function notify(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return false;
      try { new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="52" font-size="52">🍅</text></svg>' }); return true; } catch (_) { return false; }
    }
    function finish() {
      chime();
      if (isWork) { localStorage.setItem(todayKey(), getCount() + 1); notify('집중 완료! 🍅', '수고했어요. 이제 5분간 쉬어가요.'); }
      else notify('휴식 완료!', '다시 기분 좋게 집중해볼까요?');
      isWork = !isWork; remaining = isWork ? workMinutes * 60 : REST;
      deadline = Date.now() + remaining * 1000;
      draw();
    }
    function tick() {
      if (!running || !deadline) return;
      remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      draw();
      if (remaining === 0) finish();
    }
    async function toggle() {
      if (!running) {
        armSound();
        if ('Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch (_) {} }
      }
      running = !running; start.textContent = running ? '잠시 멈추기' : '계속하기';
      if (running) { deadline = Date.now() + remaining * 1000; timerId = setInterval(tick, 500); }
      else { remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000)); deadline = null; clearInterval(timerId); draw(); }
    }
    start.addEventListener('click', toggle);
    reset.addEventListener('click', () => { clearInterval(timerId); running = false; deadline = null; remaining = isWork ? workMinutes * 60 : REST; start.textContent = '시작하기'; draw(); });
    durationButtons.forEach(button => button.addEventListener('click', () => {
      workMinutes = Number(button.dataset.minutes);
      clearInterval(timerId); running = false; deadline = null; isWork = true; remaining = workMinutes * 60;
      start.textContent = '시작하기';
      durationButtons.forEach(choice => choice.setAttribute('aria-pressed', String(choice === button)));
      draw();
    }));
    testAlert.addEventListener('click', () => {
      armSound(); chime();
      const sent = notify('알림 테스트 🍅', '소리와 이 알림이 보이면 준비 완료예요.');
      testResult.textContent = sent ? '테스트 알림을 보냈어요.' : '브라우저 알림 권한을 다시 확인해주세요.';
    });
    dogChoices.forEach(button => button.addEventListener('click', () => selectDog(button.dataset.choice)));
    document.addEventListener('visibilitychange', () => { if (running) tick(); });
    selectDog('maltese');
    draw();
  </script>
</body>
</html>
